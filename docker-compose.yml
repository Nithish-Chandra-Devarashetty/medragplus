# Optional infrastructure: MongoDB + Qdrant server.
#   docker compose up -d
# then set QDRANT_URL=http://localhost:6333 in .env (and re-run scripts/ingest.py).
services:
  mongo:
    image: mongo:7
    ports: ["27017:27017"]
    volumes: [mongo-data:/data/db]
    restart: unless-stopped
  qdrant:
    image: qdrant/qdrant:latest
    ports: ["6333:6333"]
    volumes: [qdrant-data:/qdrant/storage]
    restart: unless-stopped
volumes:
  mongo-data:
  qdrant-data:
